server {
    http2 on;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name steamcommunity.com;
    server_name *.steamcommunity.com;

    location ~* ^.*(discussions|comment|forum).*$ {
        proxy_pass https://steam_community_302;
        include share_proxy_default.conf;
        proxy_set_header Host "steamcommunity.com";
        proxy_set_header User-Agent "${http_user_agent} Googlebot/2.1 (+http://www.google.com/bot.html)";
        proxy_ssl_name "statuspage.akamaized.net";
    }

    location / {
        proxy_pass https://steam_community;
        include share_proxy_empty.conf;
    }
}

server {
    http2 on;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name steampowered.com store.steampowered.com checkout.steampowered.com;

    location / {
        proxy_pass https://steam_store;
        include share_proxy_empty.conf;
    }
}

server {
    http2 on;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.steampowered.com login.steampowered.com help.steampowered.com;

    location / {
        proxy_pass https://steam_api;
        include share_proxy_empty.conf;
    }
}

server {
    http2 on;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name community.akamai.steamstatic.com;

    location / {
        proxy_pass https://akamai_cdn;
        include share_proxy_off.conf;
        proxy_set_header Host "community.steamstatic.com";
    }
}

