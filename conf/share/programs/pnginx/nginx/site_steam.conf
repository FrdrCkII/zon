server {
    http2 on;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name community.steamstatic.com community.fastly.steamstatic.com community.cloudflare.steamstatic.com;

    location /market/ {
        return 307 https://steamcommunity.com$request_uri;
    }

    location / {
        proxy_pass https://steam_fastly;
        include share_proxy_empty.conf;
        proxy_set_header Host "community.fastly.steamstatic.com";
    }
}

