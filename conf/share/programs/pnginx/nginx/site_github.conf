upstream githubassets_com {
    zone githubassets_com 64k;
    server docs.github.com:443 resolve max_fails=2 fail_timeout=30s;
    server assets.github.dev:443 resolve max_fails=2 fail_timeout=30s;
    hash $connection consistent;
}

server {
    http2 on;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name github.com www.github.com gist.github.com;

    location / {
        proxy_pass https://github_com;
        include share_proxy_buffer.conf;
    }
}

server {
    http2 on;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name codeload.github.com;

    location / {
        proxy_pass https://codeload_github_com;
        include share_proxy_buffer.conf;
    }
}

server {
    http2 on;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.github.com;

    location / {
        proxy_pass https://api_github_com;
        include share_proxy_buffer.conf;
    }
}

server {
    http2 on;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name redirect.github.com copilot.github.com services.github.com community.github.com;

    location / {
        proxy_pass https://redirect_github_com;
        include share_proxy_buffer.conf;
    }
}

server {
    http2 on;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name education.github.com enterprise.github.com classroom.github.com central.github.com
    collector.github.com;

    location / {
        proxy_pass https://edu_github_com;
        include share_proxy_buffer.conf;
    }
}

server {
    http2 on;
    listen 443 ssl;
    server_name analytics.githubassets.com www.github.io pages.github.com resources.github.com
    developer.github.com partner.github.com desktop.github.com guides.github.com support.github.com;
    server_name *.githubusercontent.com *.github.io;

    location / {
        proxy_pass https://github_usercontent;
        include share_proxy_default.conf;
    }
}

server {
    http2 on;
    listen 443 ssl;
    server_name docs.github.com assets.github.dev;
    server_name *.githubassets.com;

    location / {
        proxy_pass https://githubassets_com;
        include share_proxy_default.conf;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }
}
