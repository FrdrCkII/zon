upstream github_com {
    zone github_com 64k;
    server 20.205.243.166:443 max_fails=2 fail_timeout=30s;
    server 20.27.177.113:443 max_fails=2 fail_timeout=30s;
    server 20.200.245.247:443 max_fails=2 fail_timeout=30s;
    server github.com:443 resolve max_fails=2 fail_timeout=30s;
    server www.github.com:443 resolve max_fails=2 fail_timeout=30s;
    server gist.github.com:443 resolve max_fails=2 fail_timeout=30s;
    hash $connection consistent;
    keepalive 16;
}

