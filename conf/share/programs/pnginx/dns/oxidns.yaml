# ============================================================
# OxiDNS 配置 - 本地 DNS 服务器最终版
# 用途：本地 DNS 网关，支持 DoH/HTTP3，智能分流，IPv4/IPv6 双栈
# ============================================================
log:
  # 生产环境使用 warn，排查问题时临时改为 info 或 debug
  level: "warn"
runtime:
  # 根据 CPU 核心数调整，4 核设备保持 4 即可
  worker_threads: 4
api:
  # 管理 API 监听地址，用于 WebUI 和 probe 命令
  http: "127.0.0.1:8010"
# ============================================================
# 网络出站配置
# ============================================================
network:
  outbound:
    default: "direct"
    profiles:
      direct:
        resolver: "system"
        proxy: "none"
# ============================================================
# 插件定义
# ============================================================
plugins:
  # ---------- 定时更新订阅与规则 ----------
  - tag: "subscription_cron"
    type: "cron"
    args:
      timezone: "Asia/Shanghai"
      jobs:
        - name: "refresh_rule_subscriptions"
          interval: "24h"
          executors:
            - "$subscription_refresh"
  - tag: "subscription_refresh"
    type: "sequence"
    args:
      - exec: "$subscription_download"
      - exec: "$reload_rule_providers"
  - tag: "subscription_download"
    type: "download"
    args:
      timeout: "60s"
      startup_if_missing: true
      downloads:
        - url: "https://cdn.jsdelivr.net/gh/pmkol/easymosdns@rules/gfw_ip_list.txt"
          dir: "${WORKDIR}/rules"
          filename: "gfw_ip.txt"
        - url: "https://anti-ad.net/adguard.txt"
          dir: "${WORKDIR}/rules"
          filename: "adguard.txt"
        - url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geosite.dat"
          dir: "${WORKDIR}/rules"
          filename: "geosite.dat"
        - url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/geoip-only-cn-private.dat"
          dir: "${WORKDIR}/rules"
          filename: "geoip.dat"
  - tag: "reload_rule_providers"
    type: "reload_provider"
    args:
      - "$gfw_ip"
      - "$geoip_cn"
      - "$geosite_cn"
      - "$geosite_no_cn"
      - "$category_ads_all"
      - "$ad_rules"
  # ---------- 规则提供者 ----------
  - tag: "gfw_ip"
    type: "ip_set"
    args:
      files:
        - "${WORKDIR}/rules/gfw_ip.txt"
  - tag: "ad_rules"
    type: "adguard_rule"
    args:
      files:
        - "${WORKDIR}/rules/adguard.txt"
  - tag: "geoip_cn"
    type: "geoip"
    args:
      file: "${WORKDIR}/rules/geoip.dat"
      selectors:
        - "cn"
  - tag: "geosite_cn"
    type: "geosite"
    args:
      file: "${WORKDIR}/rules/geosite.dat"
      selectors:
        - "cn"
  - tag: "geosite_no_cn"
    type: "geosite"
    args:
      file: "${WORKDIR}/rules/geosite.dat"
      selectors:
        - "geolocation-!cn"
  - tag: "category_ads_all"
    type: "geosite"
    args:
      file: "${WORKDIR}/rules/geosite.dat"
      selectors:
        - "category-ads-all"
        - "win-spy"
        - "win-extra"
  # 空规则集，用于后续按需填充 ECS 域名
  - tag: "ecscn"
    type: "domain_set"
    args:
      exps: []
  - tag: "ecs_noncn"
    type: "domain_set"
    args:
      exps: []
  # 本地 PTR 反向解析规则，可按需添加内网网段
  - tag: "local_ptr"
    type: "domain_set"
    args:
      exps: []
  - tag: "hosts"
    type: "hosts"
    args:
      short_circuit: false
  # ---------- 执行器 ----------
  - tag: "ad_blackhole"
    type: "black_hole"
    args:
      ips:
        - "0.0.0.0"
        - "::"
      short_circuit: true
  # 已移除 rate_limiter，本地服务无需限速
  - tag: "lazy_cache"
    type: "cache"
    args:
      size: 15000
      short_circuit: false
      lazy_cache_ttl: 86400
      cache_negative: true
      max_negative_ttl: 300
      negative_ttl_without_soa: 60
      max_positive_ttl: 3600
      # TTL < 60s 的正响应不入缓存，减少缓存抖动
      min_positive_ttl: 60
      ecs_in_key: false
      dump_file: "${WORKDIR}/rules/dns_cache.dump"
      dump_interval: 7200
  - tag: "query_recorder_main"
    type: "query_recorder"
    args:
      path: "${WORKDIR}/rules/query-recorder-main.sqlite"
      queue_size: 8192
      batch_size: 512
      flush_interval_ms: 1000
      memory_tail: 1024
      retention_days: 3
      cleanup_interval_hours: 1
  # 远程上游: 使用 TCP pipeline 直连，避免依赖 bootstrap 解析
  - tag: "forward_remote"
    type: "forward"
    args:
      concurrent: 2
      response_selection: "prefer_positive"
      upstreams:
        - addr: "tcp+pipeline://[2606:4700:4700::1111]:53"
          dial_addr: "2606:4700:4700::1111"
        - addr: "tcp+pipeline://[2a02:6b8:0:1::feed:0ff]:53"
          dial_addr: "2a02:6b8:0:1::feed:0ff"
  # 本地上游: 使用国内 DoH 服务
  - tag: "forward_local"
    type: "forward"
    args:
      concurrent: 2
      response_selection: "prefer_positive"
      upstreams:
        - addr: "https://doh.pub/dns-query"
          bootstrap: "223.5.5.5:53"
          bootstrap_version: 4
        - addr: "https://doh.360.cn/dns-query"
          bootstrap: "223.5.5.5:53"
          bootstrap_version: 4
        - addr: "https://dns.alidns.com/dns-query"
          bootstrap: "223.5.5.5:53"
          bootstrap_version: 4
  # 兜底上游: 直接用 TCP 查询，避免依赖 bootstrap
  - tag: "forward_bootstrap"
    type: "forward"
    args:
      concurrent: 2
      response_selection: "prefer_positive"
      upstreams:
        - addr: "tcp+pipeline://[2606:4700:4700::1111]:53"
          dial_addr: "2606:4700:4700::1111"
        - addr: "tcp+pipeline://[2a02:6b8:0:1::feed:0ff]:53"
          dial_addr: "2a02:6b8:0:1::feed:0ff"
        - addr: "udp://[2402:4e00:1::]:53"
          dial_addr: "2402:4e00:1::"
        - addr: "udp://[2400:3200:baba::1]:53"
          dial_addr: "2400:3200:baba::1"
  # ---------- 策略序列 ----------
  - tag: "block_seq"
    type: "sequence"
    args:
      - matches: "qtype 65 255"
        exec: "reject 0"
      - matches: "qname $category_ads_all"
        exec: "$ad_blackhole"
      - matches: "qname $ad_rules"
        exec: "$ad_blackhole"
      - matches: "qname $local_ptr"
        exec: "reject 3"
  - tag: "local_seq"
    type: "sequence"
    args:
      - exec: "$forward_local"
      - matches: "has_resp"
        exec: "accept"
      - exec: "$forward_bootstrap"
      - matches: "has_resp"
        exec: "accept"
      - exec: "ttl 300"
  - tag: "remote_seq"
    type: "sequence"
    args:
      - exec: "prefer_ipv6"
      - exec: "$forward_remote"
      - matches: "has_resp"
        exec: "accept"
      - exec: "$forward_local"
      - matches: "has_resp"
        exec: "accept"
      - exec: "$forward_bootstrap"
      - matches: "has_resp"
        exec: "accept"
      - exec: "ttl 300"
  # 二次分流: 先本地解析，再按响应 IP 校验
  - tag: "local_then_check"
    type: "sequence"
    args:
      - exec: "prefer_ipv6"
      - exec: "$forward_local"
      - matches: "has_resp"
        exec: "goto check_resp_ip"
      - exec: "$forward_bootstrap"
      - matches: "has_resp"
        exec: "accept"
      - exec: "ttl 300"
  - tag: "check_resp_ip"
    type: "sequence"
    args:
      # 命中 gfw_ip 则丢弃响应，强制走远程
      - matches: "resp_ip $gfw_ip"
        exec: "drop_resp"
      - matches: "resp_ip $gfw_ip"
        exec: "goto remote_seq"
      # 响应 IP 属于中国大陆则接受
      - matches: "resp_ip $geoip_cn"
        exec: "accept"
      # 兜底: 非中国 IP 走远程
      - exec: "goto remote_seq"
  - tag: "common_seq"
    type: "sequence"
    args:
      - exec: "$query_recorder_main"
      - exec: "$hosts"
      - matches: "has_resp"
        exec: "accept"
      - exec: "jump block_seq"
      - exec: "$lazy_cache"
      - matches: "has_resp"
        exec: "accept"
      - matches: "qname $ecscn"
        exec: "$forward_local"
      - matches: "has_resp"
        exec: "accept"
      - matches: "qname $ecs_noncn"
        exec: "$forward_remote"
      - matches: "has_resp"
        exec: "accept"
      - matches: "qname $geosite_cn"
        exec: "goto local_seq"
      - matches: "qname $geosite_no_cn"
        exec: "goto remote_seq"
      - exec: "goto local_then_check"
  # ---------- 服务器 ----------
  - tag: "seq_5360"
    type: "sequence"
    args:
      - exec: "goto common_seq"
  - tag: "udp_server_5360_v4"
    type: "udp_server"
    args:
      entry: "seq_5360"
      listen: "127.0.0.1:5360"
  - tag: "tcp_server_5360_v4"
    type: "tcp_server"
    args:
      entry: "seq_5360"
      listen: "127.0.0.1:5360"
  - tag: "udp_server_5360_v6"
    type: "udp_server"
    args:
      entry: "seq_5360"
      listen: "[::1]:5360"
  - tag: "tcp_server_5360_v6"
    type: "tcp_server"
    args:
      entry: "seq_5360"
      listen: "[::1]:5360"
  # DoH 服务器: 为浏览器提供加密 DNS
  - tag: "doh_server"
    type: "http_server"
    args:
      listen: "[::1]:8443"
      cert: "${CA_CERT}"
      key: "${CA_KEY}"
      enable_http3: true
      entries:
        - path: "/dns-query"
          exec: "seq_5360"
